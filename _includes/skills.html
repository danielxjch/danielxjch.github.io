<ul class="skill-categories">
    {% for group in site.skills %}
    <li class="reveal">
        <div class="skills-card">
            <span class="category-label">{{ group.category }}</span>
            <ul class="skills-list">
                {% for tool in group.tools %}
                <li class="skill">{{ tool }}</li>
                {% endfor %}
            </ul>
        </div>
    </li>
    {% endfor %}
</ul>
