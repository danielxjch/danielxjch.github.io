<!-- Hero -->
<section class="hero-section">
    {% include decor/hero.html %}
    <div class="group">
        <div class="text">
            <span class="eyebrow">{{ site.headline }}</span>
            <h1>{{ site.name }}</h1>
            <p class="description">{{ site.description }}</p>

            <div class="links">
                <a href="{{ site.resume-url }}" target="_blank" rel="noopener noreferrer" class="btn btn--primary">Resume ↗</a>
                <a href="#projects" class="mono-link">Projects ↓</a>
                <a href="#skills" class="mono-link">Skills ↓</a>
                <a href="#contact" class="mono-link">Contact ↓</a>
            </div>

            {% include social-icons.html %}
        </div>

        <figure class="headshot">
            <div class="ticks">
                <img src="{{ site.profile_image }}" alt="Portrait of {{ site.name }}">
            </div>
            <figcaption>Fig. 01 — {{ site.name }}</figcaption>
        </figure>
    </div>
</section>
