<div class="section-decor" aria-hidden="true">
    <!-- Robotic violin, top view (from violin.png + Violin CAD.PNG).
         Confirmed bowing mechanism: a continuous rosin-coated fishing-line
         LOOP wrapped around two motor wheels that STRADDLE the string —
         one wheel sits left of the string span, one sits right, opposite
         sides of the string. Both wheels sit on the SAME side of the BOW:
         the short top run directly between the two wheel rims is the one
         active contact run (the "bow"), crossing the strings at 90
         degrees. The loop's return run is routed below, clear of the
         strings, so only the bow ever touches them — not a symmetric
         stadium with two ambiguous crossings. vs-flow / vs-wheel-a /
         vs-wheel-b are driven by script.js. -->
    <svg class="decor-violin decor-sketch decor-trace" viewBox="0 0 440 310" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <!-- body outline (two bouts + waist), pencil underlay + line -->
        <path class="dec-ghost" stroke-width="0.85" stroke-opacity="0.4" d="M166 29 Q111 62 126 122 Q140 151 123 184 Q109 245 170 283 M274 29 Q329 62 314 122 Q300 151 317 184 Q331 245 270 283"/>
        <path class="dec-line" pathLength="100" stroke-width="2.1" stroke-opacity="0.85" d="M174 30 Q126 58 136 112 Q143 139 128 174 Q117 232 174 274 M266 30 Q314 58 304 112 Q297 139 312 174 Q323 232 266 274"/>
        <path class="dec-line" pathLength="100" stroke-width="1.5" stroke-opacity="0.78" d="M174 30 Q198 43 220 42 Q242 43 266 30 M174 274 Q198 261 220 262 Q242 261 266 274"/>
        <!-- f-holes -->
        <path class="dec-line" pathLength="100" stroke-width="1.6" stroke-opacity="0.72" d="M198 150 Q189 132 196 116 M242 150 Q251 132 244 116"/>
        <!-- strings, running lengthwise (vertical): the bow meets them at 90deg -->
        <path class="dec-dim" pathLength="100" stroke-width="0.75" stroke-opacity="0.62" d="M208 40 V272 M216 40 V272 M224 40 V272 M232 40 V272"/>
        <text x="150" y="46" font-size="9" stroke="none">STRINGS</text>
        <path class="dec-dim" pathLength="100" stroke-width="0.75" d="M186 45 L206 58"/>
        <!-- bridge -->
        <path class="dec-line" pathLength="100" stroke-width="1.7" stroke-opacity="0.8" d="M203 150 H237"/>
        <text x="254" y="144" font-size="8.5" stroke="none">BRIDGE</text>
        <path class="dec-dim" pathLength="100" stroke-width="0.75" d="M252 147 L238 150"/>

        <!-- rosin-coated fishing-line LOOP: the top run is the single BOW
             crossing the strings at 90deg, directly between the two wheel
             rims; the return run sweeps below in one smooth bowl, clear of
             the strings, so it never makes a second crossing. Both wheels
             sit on the same (upper) side of the bow. -->
        <path class="dec-ghost" stroke-width="1" stroke-opacity="0.38" d="M175 160 L265 160 A18 18 0 0 1 282 178 C291 208 264 281 220 281 C176 281 149 208 158 178 A18 18 0 0 1 175 160 Z"/>
        <path class="vs-loop dec-line" pathLength="100" stroke-width="1.8" stroke-opacity="0.85" d="M176 162 L264 162 A16 16 0 0 1 280 178 C288 206 262 278 220 278 C178 278 152 206 160 178 A16 16 0 0 1 176 162 Z"/>
        <!-- accent: the travelling rosin line (offset animated on scroll) -->
        <path class="vs-flow" d="M176 162 L264 162 A16 16 0 0 1 280 178 C288 206 262 278 220 278 C178 278 152 206 160 178 A16 16 0 0 1 176 162 Z"/>

        <!-- two motor wheels, straddling the string span (opposite sides
             of the string), both on the same side of the bow -->
        <g class="vs-wheel vs-wheel-a">
            <circle class="dec-ghost" stroke-width="0.9" stroke-opacity="0.45" cx="176" cy="178" r="18"/>
            <circle class="dec-line" pathLength="100" stroke-width="2" stroke-opacity="0.86" cx="176" cy="178" r="15"/>
            <path class="dec-dim" pathLength="100" stroke-width="0.8" d="M176 165 V191 M163 178 H189"/>
            <circle class="dec-arrow" cx="182" cy="170" r="1.9" fill="currentColor" stroke="none"/>
        </g>
        <g class="vs-wheel vs-wheel-b">
            <circle class="dec-ghost" stroke-width="0.9" stroke-opacity="0.45" cx="264" cy="178" r="18"/>
            <circle class="dec-line" pathLength="100" stroke-width="2" stroke-opacity="0.86" cx="264" cy="178" r="15"/>
            <path class="dec-dim" pathLength="100" stroke-width="0.8" d="M264 165 V191 M251 178 H277"/>
            <circle class="dec-arrow" cx="270" cy="170" r="1.9" fill="currentColor" stroke="none"/>
        </g>
        <text x="168" y="96" font-size="8.5" stroke="none">WHEELS STRADDLE STRING</text>
        <text x="168" y="106" font-size="8.5" stroke="none">&#8212; SAME SIDE OF BOW</text>

        <!-- 90-degree contact marker where the bow crosses the strings -->
        <path class="dec-dim" pathLength="100" stroke-width="0.9" d="M220 162 V156 H214"/>
        <text x="150" y="154" font-size="8.5" stroke="none">90&#176; CONTACT</text>
        <path class="dec-dim" pathLength="100" stroke-width="0.75" d="M186 151 L212 160"/>

        <!-- travel arrows: bow run and return run move opposite ways -->
        <path class="dec-arrow" stroke-width="1.15" d="M202 158 L194 162 L202 166"/>
        <path class="dec-arrow" stroke-width="1.15" d="M246 190 L250 198 L254 190"/>
        <text x="118" y="206" font-size="9" stroke="none">ROSIN-COATED FISHING-LINE LOOP</text>
        <text x="118" y="219" font-size="8.5" stroke="none">CONTINUOUS TRAVEL &#8212; NO RESET</text>

        <!-- fingering servos above the neck (from the build photo) -->
        <path class="dec-dim" pathLength="100" stroke-width="0.9" stroke-opacity="0.6" d="M60 250 H98 V232 H60 Z M108 250 H146 V232 H108 Z"/>
        <text x="60" y="268" font-size="8.5" stroke="none">FINGERING SERVOS &#215;4</text>

        <path class="dec-fade" stroke-width="0.7" stroke-opacity="0.5" stroke-dasharray="7 5" d="M220 28 V282"/>
        <text x="42" y="298" font-size="10" stroke="none">BOWING STUDY — TOP VIEW / CONTINUOUS ROSIN LINE</text>
    </svg>
</div>
