<div class="section-decor" aria-hidden="true">
    <!-- transmission study: Yagi-Uda downlink beaming a signal off-sheet
         (echoes the CanSat telemetry link). The .ct-wave beam is a live
         accent whose dash offset the scroll driver animates. -->
    <svg class="decor-c1 decor-sketch decor-trace" viewBox="0 0 300 300" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <!-- registration tick -->
        <path class="dec-fade" stroke-width="0.7" d="M272 52 H286 M279 45 V59"/>

        <!-- radiated wavefronts, main lobe forward toward the directors -->
        <path class="dec-fade" stroke-width="0.9" stroke-opacity="0.6" d="M217 83 Q245 150 217 217"/>
        <path class="dec-fade" stroke-width="0.9" stroke-opacity="0.5" d="M238 62 Q275 150 238 238"/>
        <path class="dec-fade" stroke-width="0.9" stroke-opacity="0.42" d="M260 41 Q305 150 260 259"/>

        <!-- boom -->
        <path class="dec-ghost" stroke-width="0.9" stroke-opacity="0.5" d="M55.5 150 H204.5"/>
        <path class="dec-line" stroke-width="1.7" stroke-opacity="0.85" pathLength="100" d="M55 150 H205"/>

        <!-- reflector (rear, longest) -->
        <path class="dec-ghost" stroke-width="0.8" stroke-opacity="0.5" d="M55 106 V194"/>
        <path class="dec-line" stroke-width="1.7" stroke-opacity="0.85" pathLength="100" d="M55 105 V195"/>

        <!-- driven element with feed gap -->
        <path class="dec-line" stroke-width="1.7" stroke-opacity="0.9" pathLength="100" d="M82 112 V146"/>
        <path class="dec-line" stroke-width="1.7" stroke-opacity="0.9" pathLength="100" d="M82 154 V188"/>

        <!-- directors (front, tapering) -->
        <path class="dec-line" stroke-width="1.5" stroke-opacity="0.82" pathLength="100" d="M118 114 V186"/>
        <path class="dec-line" stroke-width="1.5" stroke-opacity="0.8" pathLength="100" d="M152 117 V183"/>
        <path class="dec-line" stroke-width="1.5" stroke-opacity="0.78" pathLength="100" d="M186 120 V180"/>

        <!-- coax feed down the boom to the transmitter -->
        <path class="dec-line" stroke-width="1.3" stroke-opacity="0.8" pathLength="100" d="M82 150 V226 H50"/>
        <path class="dec-line" stroke-width="1.4" stroke-opacity="0.85" pathLength="100" d="M50 214 H14 V240 H50 Z"/>
        <path class="dec-fade" stroke-width="0.9" stroke-opacity="0.7" d="M18 231 h4 v-8 h4 v8 h4 v-8 h4 v8 h4"/>

        <!-- boresight span between reflector and front director -->
        <path class="dec-dim" stroke-width="0.8" stroke-opacity="0.8" pathLength="100" d="M55 168 H186"/>
        <path class="dec-arrow" stroke-width="1.1" d="M62 165 L55 168 L62 171"/>
        <path class="dec-arrow" stroke-width="1.1" d="M179 165 L186 168 L179 171"/>

        <!-- outgoing signal beam (animated) + boresight arrow -->
        <path class="ct-wave" d="M205 150 H336"/>
        <path class="dec-arrow" stroke-width="1.2" d="M290 144 L299 150 L290 156"/>

        <text x="14" y="44" font-size="10.5" stroke="none" transform="rotate(-1 14 44)">YAGI &#183; 5-EL</text>
        <text x="34" y="100" font-size="8.5" stroke="none">REFL</text>
        <text x="128" y="108" font-size="8.5" stroke="none">DIR &#215;3</text>
        <text x="19" y="209" font-size="8.5" stroke="none">TX</text>
        <text x="14" y="257" font-size="9" stroke="none" transform="rotate(-1 14 257)">434 MHz</text>
        <text x="206" y="140" font-size="9.5" stroke="none" transform="rotate(-1 206 140)">SIGNAL OUT &#8594;</text>
        <text x="108" y="184" font-size="9" stroke="none">BORESIGHT</text>
        <text x="120" y="276" font-size="9.5" stroke="none" transform="rotate(-1 120 276)">GAIN &#8776; 9 dBi</text>
    </svg>
</div>
