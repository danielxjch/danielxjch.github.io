<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>document.documentElement.classList.add('js');</script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/syntax.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' fill='none' stroke='%230f4fd1' stroke-width='3'/%3E%3Cpath d='M10 22V10h5a6 6 0 0 1 0 12z' fill='%230f4fd1'/%3E%3C/svg%3E">

    <script src="{{ '/assets/js/script.js' | relative_url }}" defer></script>

    {% if page.title %}
    <title>{{ page.title }} — {{ site.name }}</title>
    {% else %}
    <title>{{ site.title }}</title>
    {% endif %}
    <meta name="description" content="{{ page.description | default: site.description | strip_newlines | truncate: 160 }}">
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | truncate: 160 }}">
    <meta property="og:type" content="website">
</head>
<body>
    {% include sheet-decor.html %}
    {% include navbar.html %}

    <div class="page">{{ content }}</div>

    {% include footer.html %}
</body>
</html>
