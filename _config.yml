# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.

# Main Page Setup

title: Daniel Xu's Portfolio # This is what shows up in the tab of the browser



# Hero Section
name: Daniel Xu
headline: Mechanical Engineering Student @ Georgia Tech
description: >- # dont remove this line. this will ignore all new lines until the next section
  I am a mechanical engineering student with a focus on robotics and autonomous systems.
  In the LIDAR lab at Georgia Tech, I am currently developing computer vision systems for quadruped navigation
  and sensorized feet for the Cassie biped. I am driven by solving complex engineering problems and creating designs that impact the world.

# Place your profile image in /assets/images/profile-image/folder and edit the file name
profile_image: ./assets/images/profile-image/1729361401777.jfif


# Link your resume
