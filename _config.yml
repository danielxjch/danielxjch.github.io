# Active theme. Swap this block for one of the presets below to change the whole site.
colors: # drafting (light) — paper white, ink text, blueprint-blue accent
  text: "#1a1d21"
  muted: "#5b6470"
  border: "#d8dad2"
  grid: "#e9ebe3"
  link: "#0f4fd1"
  highlight: "#0f4fd1"
  background: "#fafaf7"
  light_background: "#f1f2ec"

# Presets — copy one over the block above (keep the `colors:` key and indentation).
#
# blueprint (dark):
#   text: "#e8eaed"
#   muted: "#9aa3ad"
#   border: "#28313e"
#   grid: "#1a222d"
#   link: "#5ea0ff"
#   highlight: "#5ea0ff"
#   background: "#0e131a"
#   light_background: "#151c26"
#
# `muted` and `grid` are optional — if removed, they fall back to `text` and `border`.






#########################################################################################################
# Build settings for the site. Editing the below may cause the site to malfunction.

collections:
  projects:
    output: true
    permalink: /projects/:path/


markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1
      indent: 0

plugins:
  - jekyll-feed

include:
  - _projects


